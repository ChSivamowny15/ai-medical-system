<!DOCTYPE html>
<html>

<head>

    <title>AI Medical Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {

            margin: 0;

            font-family: 'Segoe UI', sans-serif;

            color: white;

            background:
                linear-gradient(rgba(0, 0, 0, 0.78),
                    rgba(0, 0, 0, 0.78)),
                url("https://media.istockphoto.com/id/2191182540/photo/hospital-hallway-with-doctors-nurses-and-specialists-in-hospital-female-and-male-physicians.jpg?s=612x612&w=0&k=20&c=7qbXpqpZ7kiQxsjb1NF1GtVLK6FEQBlouCJx5peP-dQ=") no-repeat center center fixed;

            background-size: cover;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            position: absolute;

            top: 20px;

            right: 30px;

            z-index: 1000;
        }

        .navbar a {

            text-decoration: none;

            color: white;

            background: rgba(0, 198, 255, 0.2);

            padding: 10px 18px;

            margin-left: 10px;

            border-radius: 25px;

            font-size: 14px;

            transition: 0.3s;

            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .navbar a:hover {

            background: #00c6ff;

            transform: scale(1.08);

            box-shadow: 0 0 12px #00c6ff;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: 92%;

            margin: auto;

            padding-top: 50px;

            padding-bottom: 50px;
        }

        h1 {

            text-align: center;

            color: #00e5ff;

            font-size: 48px;

            margin-bottom: 45px;

            text-shadow: 0 0 15px #00c6ff;
        }

        /* =========================
           TOP STATS
        ========================= */

        .stats {

            display: flex;

            justify-content: center;

            gap: 22px;

            flex-wrap: wrap;

            margin-bottom: 50px;
        }

        .stat-card {

            width: 210px;

            background: rgba(0, 0, 0, 0.58);

            border-radius: 22px;

            padding: 24px;

            text-align: center;

            backdrop-filter: blur(10px);

            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);

            transition: 0.3s;
        }

        .stat-card:hover {

            transform: translateY(-8px);

            box-shadow: 0 0 25px #00c6ff;
        }

        .stat-card h2 {

            font-size: 20px;

            color: #00e5ff;

            margin-bottom: 12px;
        }

        .stat-card p {

            font-size: 36px;

            font-weight: bold;

            margin: 0;
        }

        /* =========================
           CHARTS
        ========================= */

        .charts {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(350px, 1fr));

            gap: 30px;
        }

        .chart-box {

            background: rgba(0, 0, 0, 0.58);

            padding: 25px;

            border-radius: 25px;

            backdrop-filter: blur(10px);

            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);

            transition: 0.3s;
        }

        .chart-box:hover {

            transform: translateY(-5px);

            box-shadow: 0 0 25px #00c6ff;
        }

        .chart-box h2 {

            text-align: center;

            color: #00e5ff;

            margin-bottom: 20px;

            font-size: 26px;
        }

        canvas {

            background: rgba(255, 255, 255, 0.05);

            border-radius: 15px;

            padding: 10px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width:900px) {

            h1 {

                font-size: 35px;
            }

            .navbar {

                right: 10px;

                top: 10px;
            }

            .navbar a {

                padding: 8px 12px;

                font-size: 12px;
            }

            .stats {

                flex-direction: column;

                align-items: center;
            }
        }
    </style>

</head>

<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <div class="navbar">

        <a href="index.html">Home</a>

        <a href="test.html">Predict</a>

        <a href="history.html">History</a>

        <a href="dashboard.html">Dashboard</a>

    </div>

    <!-- =========================
         MAIN CONTAINER
    ========================= -->

    <div class="container">

        <h1>📊 AI Medical Dashboard</h1>

        <!-- =========================
             TOP STATS
        ========================= -->

        <div class="stats">

            <div class="stat-card">

                <h2>Total Scans</h2>

                <p id="totalScans">0</p>

            </div>

            <div class="stat-card">

                <h2>🧠 MRI Scans</h2>

                <p id="mriCount">0</p>

            </div>

            <div class="stat-card">

                <h2>🫁 CT Scans</h2>

                <p id="ctCount">0</p>

            </div>

            <div class="stat-card">

                <h2>🩹 UV Scans</h2>

                <p id="uvCount">0</p>

            </div>

            <div class="stat-card">

                <h2>⚠ Abnormal</h2>

                <p id="abnormalCases">0</p>

            </div>

            <div class="stat-card">

                <h2>✅ Normal</h2>

                <p id="normalCases">0</p>

            </div>

        </div>

        <!-- =========================
             CHARTS
        ========================= -->

        <div class="charts">

            <!-- MRI -->

            <div class="chart-box">

                <h2>🧠 MRI Analysis</h2>

                <canvas id="mriChart"></canvas>

            </div>

            <!-- CT -->

            <div class="chart-box">

                <h2>🫁 CT Analysis</h2>

                <canvas id="ctChart"></canvas>

            </div>

            <!-- UV -->

            <div class="chart-box">

                <h2>🩹 UV Analysis</h2>

                <canvas id="uvChart"></canvas>

            </div>

        </div>

    </div>

    <script>

        fetch("http://127.0.0.1:5000/history")

            .then(res => res.json())

            .then(data => {

                // =====================
                // TOTAL COUNTS
                // =====================

                let total = data.length;

                let abnormal =
                    data.filter(x =>
                        x.prediction === "yes").length;

                let normal =
                    total - abnormal;

                let mriCount =
                    data.filter(x =>
                        x.scan_type === "MRI").length;

                let ctCount =
                    data.filter(x =>
                        x.scan_type === "CT").length;

                let uvCount =
                    data.filter(x =>
                        x.scan_type === "UV").length;

                document.getElementById(
                    "totalScans").innerText = total;

                document.getElementById(
                    "abnormalCases").innerText = abnormal;

                document.getElementById(
                    "normalCases").innerText = normal;

                document.getElementById(
                    "mriCount").innerText = mriCount;

                document.getElementById(
                    "ctCount").innerText = ctCount;

                document.getElementById(
                    "uvCount").innerText = uvCount;

                // =====================
                // MRI
                // =====================

                let mriYes =
                    data.filter(x =>
                        x.scan_type === "MRI" &&
                        x.prediction === "yes").length;

                let mriNo =
                    data.filter(x =>
                        x.scan_type === "MRI" &&
                        x.prediction === "no").length;

                // =====================
                // CT
                // =====================

                let ctYes =
                    data.filter(x =>
                        x.scan_type === "CT" &&
                        x.prediction === "yes").length;

                let ctNo =
                    data.filter(x =>
                        x.scan_type === "CT" &&
                        x.prediction === "no").length;

                // =====================
                // UV
                // =====================

                let uvYes =
                    data.filter(x =>
                        x.scan_type === "UV" &&
                        x.prediction === "yes").length;

                let uvNo =
                    data.filter(x =>
                        x.scan_type === "UV" &&
                        x.prediction === "no").length;

                // =====================
                // MRI CHART
                // =====================

                new Chart(
                    document.getElementById("mriChart"),
                    {

                        type: "doughnut",

                        data: {

                            labels: [
                                "Abnormal",
                                "Normal"
                            ],

                            datasets: [{
                                data: [
                                    mriYes,
                                    mriNo
                                ],

                                backgroundColor: [
                                    "#ff4d4d",
                                    "#00ff99"
                                ]
                            }]
                        }
                    }
                );

                // =====================
                // CT CHART
                // =====================

                new Chart(
                    document.getElementById("ctChart"),
                    {

                        type: "doughnut",

                        data: {

                            labels: [
                                "Abnormal",
                                "Normal"
                            ],

                            datasets: [{
                                data: [
                                    ctYes,
                                    ctNo
                                ],

                                backgroundColor: [
                                    "#ff884d",
                                    "#00c6ff"
                                ]
                            }]
                        }
                    }
                );

                // =====================
                // UV CHART
                // =====================

                new Chart(
                    document.getElementById("uvChart"),
                    {

                        type: "doughnut",

                        data: {

                            labels: [
                                "Abnormal",
                                "Normal"
                            ],

                            datasets: [{
                                data: [
                                    uvYes,
                                    uvNo
                                ],

                                backgroundColor: [
                                    "#ff00aa",
                                    "#00ffcc"
                                ]
                            }]
                        }
                    }
                );

            })

            .catch(error => {

                console.log("Error loading dashboard");

            });

    </script>

</body>

</html>
