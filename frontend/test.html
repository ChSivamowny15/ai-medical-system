<!DOCTYPE html>
<html>

<head>

    <title>AI Medical Report System</title>

    <style>
        body {

            margin: 0;
            padding: 0;

            font-family: 'Segoe UI', sans-serif;

            background: linear-gradient(135deg,
                    #0b1f2a,
                    #123447,
                    #1d4b63);

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            color: white;

            overflow-y: auto;
        }

        /* 🌐 NAVBAR */

        .navbar {

            position: absolute;

            top: 20px;

            right: 30px;

            z-index: 1000;
        }

        .navbar a {

            text-decoration: none;

            color: white;

            background: rgba(0, 198, 255, 0.2);

            padding: 10px 18px;

            margin-left: 10px;

            border-radius: 25px;

            font-size: 14px;

            transition: 0.3s;

            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .navbar a:hover {

            background: #00c6ff;

            transform: scale(1.08);
        }

        /* 📦 CONTAINER */

        .container {

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(12px);

            padding: 35px;

            border-radius: 22px;

            text-align: center;

            width: 470px;

            box-shadow: 0 0 35px rgba(0, 0, 0, 0.5);

            margin-top: 40px;

            margin-bottom: 40px;

            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        h2 {

            margin-bottom: 10px;

            font-size: 30px;

            color: #00e5ff;

            text-shadow: 0 0 10px #00c6ff;
        }

        .subtitle {

            font-size: 15px;

            color: rgba(255, 255, 255, 0.8);

            margin-bottom: 20px;
        }

        /* 🧠 CANVAS */

        #brainCanvas {

            width: 100%;

            height: 150px;

            display: block;

            margin: 15px auto 25px auto;
        }

        /* 📝 INPUTS */

        input,
        select,
        textarea {

            margin: 10px 0;

            padding: 12px;

            width: 88%;

            border-radius: 12px;

            border: none;

            font-size: 15px;

            outline: none;

            background: rgba(255, 255, 255, 0.12);

            color: white;

            transition: 0.3s;
        }

        input::placeholder,
        textarea::placeholder {

            color: rgba(255, 255, 255, 0.7);
        }

        input:focus,
        select:focus,
        textarea:focus {

            box-shadow: 0 0 12px #00c6ff;
        }

        select option {

            color: black;
        }

        textarea {

            resize: none;
        }

        /* 🖼 IMAGE PREVIEW */

        #preview {

            width: 240px;

            display: none;

            margin-top: 18px;

            border-radius: 18px;

            border: 3px solid #00c6ff;

            box-shadow: 0 0 20px #00c6ff;

            object-fit: cover;
        }

        /* 🔘 BUTTON */

        button {

            padding: 13px 28px;

            background: linear-gradient(45deg,
                    #00c6ff,
                    #0072ff);

            border: none;

            border-radius: 30px;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            margin-top: 18px;
        }

        button:hover {

            transform: scale(1.06);

            box-shadow: 0 0 20px #00c6ff;
        }

        /* 📌 RESULT BOX */

        #resultBox {

            display: none;

            margin-top: 25px;

            padding: 25px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.15);

            text-align: left;
        }

        .result-item {

            margin: 18px 0;

            font-size: 20px;

            font-weight: bold;
        }

        @media(max-width:600px) {

            .container {

                width: 90%;
                padding: 25px;
            }
        }
    </style>

</head>

<body>

    <!-- 🌐 NAVBAR -->

    <div class="navbar">

        <a href="index.html">Home</a>

        <a href="history.html">History</a>

        <a href="dashboard.html">Dashboard</a>

    </div>

    <!-- 📦 MAIN CONTAINER -->

    <div class="container">

        <h2>🩺 AI Multimodal Medical Detection</h2>

        <p class="subtitle">
            MRI • CT • UV Analysis with AI Report
        </p>

        <!-- 🧠 AI ANIMATION -->

        <canvas id="brainCanvas"></canvas>

        <!-- 👤 PATIENT DETAILS -->

        <input type="text" id="patientName" placeholder="Patient Name">

        <br>

        <input type="number" id="patientAge" placeholder="Patient Age">

        <br>

        <select id="patientGender">

            <option value="">
                Select Gender
            </option>

            <option value="Male">
                Male
            </option>

            <option value="Female">
                Female
            </option>

        </select>

        <br>

        <textarea id="patientSymptoms" placeholder="Enter Symptoms" rows="4"></textarea>

        <br>

        <!-- 🩺 SCAN TYPE -->

        <select id="scanType">

            <option value="mri">
                🧠 MRI Scan
            </option>

            <option value="ct">
                🫁 CT Scan
            </option>

            <option value="uv">
                🩹 UV Scan
            </option>

        </select>

        <br>

        <!-- 📂 FILE -->

        <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">

        <br>

        <!-- 🖼 IMAGE PREVIEW -->

        <img id="preview" src="">

        <br>

        <!-- 🔍 BUTTON -->

        <button onclick="uploadImage()">

            🔍 Predict Scan

        </button>

        <!-- 📌 RESULT BOX -->

        <div id="resultBox">

            <div class="result-item" id="scanResult"></div>

            <div class="result-item" id="predictionResult"></div>

            <div class="result-item" id="confidenceResult"></div>

        </div>

        <!-- 📄 DOWNLOAD -->

        <button id="downloadBtn" onclick="downloadReport()" style="display:none;">

            📄 Download Report

        </button>

    </div>

    <script>

        let lastResult = null;

        // =========================
        // 🧠 BRAIN ANIMATION
        // =========================

        const canvas =
            document.getElementById("brainCanvas");

        const ctx =
            canvas.getContext("2d");

        canvas.width = 420;

        canvas.height = 150;

        let nodes = [];

        for (let i = 0; i < 40; i++) {

            nodes.push({

                x: Math.random() * canvas.width,

                y: Math.random() * canvas.height,

                vx: (Math.random() - 0.5),

                vy: (Math.random() - 0.5)
            });
        }

        function drawBrain() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            for (let i = 0; i < nodes.length; i++) {

                for (let j = i + 1; j < nodes.length; j++) {

                    let dx =
                        nodes[i].x - nodes[j].x;

                    let dy =
                        nodes[i].y - nodes[j].y;

                    let dist =
                        Math.sqrt(dx * dx + dy * dy);

                    if (dist < 100) {

                        ctx.strokeStyle =
                            "rgba(0,255,255,0.2)";

                        ctx.beginPath();

                        ctx.moveTo(
                            nodes[i].x,
                            nodes[i].y
                        );

                        ctx.lineTo(
                            nodes[j].x,
                            nodes[j].y
                        );

                        ctx.stroke();
                    }
                }
            }

            nodes.forEach(node => {

                ctx.beginPath();

                ctx.arc(
                    node.x,
                    node.y,
                    3,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = "#00ffff";

                ctx.fill();

                node.x += node.vx;

                node.y += node.vy;

                if (
                    node.x < 0 ||
                    node.x > canvas.width
                )
                    node.vx *= -1;

                if (
                    node.y < 0 ||
                    node.y > canvas.height
                )
                    node.vy *= -1;
            });

            requestAnimationFrame(drawBrain);
        }

        drawBrain();

        // =========================
        // 🖼 IMAGE PREVIEW
        // =========================

        function previewImage(event) {

            const image =
                document.getElementById("preview");

            image.src =
                URL.createObjectURL(
                    event.target.files[0]
                );

            image.style.display = "block";
        }

        // =========================
        // 🔍 AI PREDICTION
        // =========================

        function uploadImage() {

            const file =
                document.getElementById("fileInput").files[0];

            const scanType =
                document.getElementById("scanType").value;

            const patientName =
                document.getElementById("patientName").value;

            const patientAge =
                document.getElementById("patientAge").value;

            const patientGender =
                document.getElementById("patientGender").value;

            const patientSymptoms =
                document.getElementById("patientSymptoms").value;

            if (!file) {

                alert("Please select a scan image");

                return;
            }

            let formData = new FormData();

            formData.append("file", file);

            formData.append("scan_type", scanType);

            formData.append("patient_name", patientName);

            formData.append("patient_age", patientAge);

            formData.append("patient_gender", patientGender);

            formData.append("patient_symptoms", patientSymptoms);

            fetch(
                "http://127.0.0.1:5000/predict",
                {

                    method: "POST",

                    body: formData
                }
            )

                .then(res => res.json())

                .then(data => {

                    lastResult = data;

                    document.getElementById("resultBox")
                        .style.display = "block";

                    // ✅ SCAN TYPE

                    document.getElementById("scanResult")
                        .innerHTML =
                        "📌 Scan Type : "
                        + data.scan_type.toUpperCase();

                    // ✅ PREDICTION

                    if (data.prediction === "yes") {

                        document.getElementById("predictionResult")
                            .innerHTML =
                            "🧠 Result : ⚠ Abnormality Detected";

                        document.getElementById("predictionResult")
                            .style.color = "red";

                    }

                    else {

                        document.getElementById("predictionResult")
                            .innerHTML =
                            "🧠 Result : ✅ Normal";

                        document.getElementById("predictionResult")
                            .style.color = "#00ff99";
                    }

                    // ✅ CONFIDENCE

                    document.getElementById("confidenceResult")
                        .innerHTML =
                        "📊 Confidence : "
                        + data.confidence + "%";

                    // 🔊 AI VOICE

                    let voiceText = "";

                    if (data.prediction === "yes") {

                        voiceText =
                            "Abnormality detected in "
                            + data.scan_type
                            + " scan with "
                            + data.confidence
                            + " percent confidence.";

                    }

                    else {

                        voiceText =
                            "No abnormality detected in "
                            + data.scan_type
                            + " scan.";
                    }

                    let speech =
                        new SpeechSynthesisUtterance(
                            voiceText
                        );

                    speech.lang = "en-US";

                    window.speechSynthesis.speak(speech);

                    document.getElementById("downloadBtn")
                        .style.display = "inline-block";
                })

                .catch(error => {

                    alert("Server Error");
                });
        }

        // =========================
        // 📄 DOWNLOAD REPORT
        // =========================

        function downloadReport() {

            fetch(
                "http://127.0.0.1:5000/download-report",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(lastResult)
                }
            )

                .then(response => response.blob())

                .then(blob => {

                    const url =
                        window.URL.createObjectURL(blob);

                    const a =
                        document.createElement("a");

                    a.href = url;

                    a.download = "AI_Report.docx";

                    document.body.appendChild(a);

                    a.click();

                    a.remove();
                });
        }

    </script>

</body>

</html>
